services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB:       lottodb
      POSTGRES_USER:     lottouser
      POSTGRES_PASSWORD: lottopass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - lotto-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lottouser -d lottodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB:       lottodb
      POSTGRES_USER:     lottouser
      POSTGRES_PASSWORD: lottopass
      POSTGRES_HOST:     db
      POSTGRES_PORT:     "5432"
      DJANGO_SECRET_KEY: "change-me-in-production"
    networks:
      - lotto-net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - lotto-net

volumes:
  postgres_data:

networks:
  lotto-net:
    driver: bridge
