{% extends 'lotto/base.html' %}
{% block content %}
<h2>로그인</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p><label>아이디: <input type="text" name="username"></label></p>
  <p><label>비밀번호: <input type="password" name="password"></label></p>
  <button type="submit">로그인</button>
</form>
<p><a href="{% url 'register' %}">회원가입</a></p>
{% endblock %}
