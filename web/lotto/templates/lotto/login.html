{% extends 'lotto/base.html' %}
{% block content %}
<h2>로그인</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p>아이디: <input type="text" name="username" autofocus></p>
  <p>비밀번호: <input type="password" name="password"></p>
  <button type="submit">로그인</button>
</form>
<p><a href="{% url 'register' %}">계정이 없으신가요? 회원가입</a></p>
{% endblock %}
