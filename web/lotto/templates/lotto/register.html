{% extends 'lotto/base.html' %}
{% block content %}
<h2>회원가입</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p><label>아이디: <input type="text" name="username"></label></p>
  <p><label>비밀번호: <input type="password" name="password1"></label></p>
  <p><label>비밀번호 확인: <input type="password" name="password2"></label></p>
  <button type="submit">가입</button>
</form>
<p><a href="{% url 'login' %}">로그인으로 돌아가기</a></p>
{% endblock %}
