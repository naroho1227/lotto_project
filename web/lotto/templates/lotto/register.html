{% extends 'lotto/base.html' %}
{% block content %}
<h2>회원가입</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p>아이디: <input type="text" name="username" autofocus></p>
  <p>비밀번호: <input type="password" name="password1"></p>
  <p>비밀번호 확인: <input type="password" name="password2"></p>
  <button type="submit">가입하기</button>
</form>
<p><a href="{% url 'login' %}">이미 계정이 있으신가요? 로그인</a></p>
{% endblock %}
