<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로또 6/45</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    nav a { margin-right: 15px; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
    th { background: #f0f0f0; }
    .error { color: red; }
    .msg   { color: green; }
    input[type=number], input[type=text], input[type=password] { padding: 4px 8px; margin: 4px; }
    button { padding: 6px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🎱 로또 6/45</h1>
  <nav>
    {% if user.is_authenticated %}
      <a href="{% url 'index' %}">홈</a>
      <a href="{% url 'buy_manual' %}">수동 구매</a>
      <a href="{% url 'buy_auto' %}">자동 구매</a>
      <a href="{% url 'my_tickets' %}">내 티켓</a>
      <a href="{% url 'check' %}">당첨 확인</a>
      {% if user.is_staff %}
        <a href="{% url 'admin_sales' %}">판매 내역</a>
        <a href="{% url 'admin_draw' %}">추첨</a>
        <a href="{% url 'admin_winners' %}">당첨 내역</a>
      {% endif %}
      <a href="{% url 'logout' %}">로그아웃 ({{ user.username }})</a>
    {% else %}
      <a href="{% url 'login' %}">로그인</a>
      <a href="{% url 'register' %}">회원가입</a>
    {% endif %}
  </nav>
  <hr>
  {% if messages %}
    {% for msg in messages %}
      <p class="msg">{{ msg }}</p>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
