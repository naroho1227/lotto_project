{% extends 'lotto/base.html' %}
{% block content %}
<h2>수동 구매 — 제 {{ next_draw_no }}회차</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p>1~45 사이의 서로 다른 숫자 6개를 입력하세요.</p>
  {% for i in "123456" %}
    <input type="number" name="n{{ i }}" min="1" max="45" required style="width:60px">
  {% endfor %}
  <br><br>
  <button type="submit">구매</button>
</form>
{% endblock %}
