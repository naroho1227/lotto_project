{% extends 'lotto/base.html' %}
{% block content %}
<h2>수동 번호 구매</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p>
    <input type="number" name="n1" min="1" max="45" required style="width:60px">
    <input type="number" name="n2" min="1" max="45" required style="width:60px">
    <input type="number" name="n3" min="1" max="45" required style="width:60px">
    <input type="number" name="n4" min="1" max="45" required style="width:60px">
    <input type="number" name="n5" min="1" max="45" required style="width:60px">
    <input type="number" name="n6" min="1" max="45" required style="width:60px">
  </p>
  <p><small>1~45 사이의 중복 없는 숫자 6개를 입력하세요.</small></p>
  <button type="submit">구매</button>
</form>
{% endblock %}
